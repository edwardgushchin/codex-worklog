name: Feature request
description: Propose a focused improvement to Codex Worklog.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need before the implementation. Breaking lifecycle, privacy, or file-format proposals require a migration plan.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and discussions for this request.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Worklog format
        - Context recovery
        - Lifecycle hooks
        - Installation or marketplace
        - Configuration
        - Privacy or security
        - Cross-platform support
        - Skill or documentation
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change from a user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility, privacy, and migration impact
      description: Cover operating systems, existing worklogs, stored data, and hook behavior.

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's Code of Conduct.
          required: true
